events{
}

http{
  include mime.types;

  # Plain HTTP: serve the ACME challenge, redirect everything else to HTTPS.
  server{
    listen 80;
    server_name yizheliu.com www.yizheliu.com;

    # Kept on plain HTTP so certificate renewals do not depend on TLS.
    location /.well-known/acme-challenge/ {
      root /home/yizow/WebPi/www;
    }

    location / {
      return 301 https://$host$request_uri;
    }
  }

  server{
    listen 443 ssl http2;
    server_name yizheliu.com www.yizheliu.com;

    ssl_certificate     /etc/letsencrypt/live/yizheliu.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yizheliu.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    autoindex on;

    location / {
      root /home/yizow/WebPi/www;
    }

    location /node {
      proxy_pass http://127.0.0.1:8081;
    }

    location /github_deploy {
      proxy_pass http://127.0.0.1:8082;
    }

    location ~* \.(jpg|jpeg)$ {
      root /home/yizow/WebPi/www/resources;
      expires 30d;
    }

    location ~* \.(css)$ {
      root /home/yizow/WebPi/www/css;
      expires 30d;
    }

    location /blog {
      root /home/yizow/WebPi/www/blog;
      proxy_pass http://127.0.0.1:8083;
    }

    location ~ /recipes/.*\.md$ {
      proxy_pass http://127.0.0.1:8084;
    }
  }
}
